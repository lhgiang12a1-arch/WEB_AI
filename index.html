<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Double Glowing Heart & Custom Text (Optimized Fix)</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas {
        display: block;
      }

      .input-container {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
      }

      #nameInput {
        padding: 12px 25px;
        font-size: 1.2rem;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid #064bfa;
        border-radius: 30px;
        color: #fff;
        outline: none;
        text-align: center;
        box-shadow: 0 0 15px #064bfa;
        font-family: Arial, sans-serif;
        width: 250px;
        transition: all 0.3s ease;
      }

      #nameInput:focus {
        border-color: #30a2f6;
        box-shadow: 0 0 25px #30a2f6;
        width: 300px;
        background: rgba(0, 0, 0, 0.8);
      }

      #nameInput::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>

  <body>
    <div class="input-container">
      <input
        type="text"
        id="nameInput"
        placeholder="Nhập tên vào đây..."
        value=""
        autocomplete="off"
      />
    </div>
    <canvas id="heartCanvas"></canvas>

    <script>
      const canvas = document.getElementById("heartCanvas");
      const ctx = canvas.getContext("2d");
      const nameInput = document.getElementById("nameInput");

      let width, height;

      const colors = [
        "#30a2f6",
        "#064bfa",
        "#93c5fd",
        "#2563eb",
        "#bfdbfe",
        "#1d4ed8",
      ];

      let isExploded = false;
      let explosionTimeout;

      let allParticles = [];

      const FLOAT_COUNT = 150;
      const BURST_COUNT = 1500;
      const OUTER_BURST_COUNT = 1500;

      let currentText = nameInput.value;
      let baseHeartScale = 15;

      class Particle {
        constructor(type, baseX = 0, baseY = 0) {
          this.type = type;
          this.color = colors[Math.floor(Math.random() * colors.length)];

          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 5;
          this.vy = (Math.random() - 0.5) * 5;

          if (type === "burst" || type === "outer_burst") {
            this.t = Math.random() * Math.PI * 2;
            this.offsetX = (Math.random() - 0.5) * 15;
            this.offsetY = (Math.random() - 0.5) * 15;
            this.size = Math.random() * 1.5 + 1.5;

            // Tính sẵn tọa độ trái tim để giảm tải cho lúc render
            this.hx = 16 * Math.pow(Math.sin(this.t), 3);
            this.hy = -(
              13 * Math.cos(this.t) -
              5 * Math.cos(2 * this.t) -
              2 * Math.cos(3 * this.t) -
              Math.cos(4 * this.t)
            );
          } else if (type === "float") {
            this.vx = (Math.random() - 0.5) * 0.8;
            this.vy = Math.random() * -1 - 0.5;
            this.size = Math.random() * 2 + 0.5;
          } else if (type === "text") {
            this.baseX = baseX;
            this.baseY = baseY;
            this.size = Math.random() * 1.5 + 0.8;
          }
        }

        explode(mouseX, mouseY) {
          if (this.type !== "float") {
            const dx = this.x - mouseX;
            const dy = this.y - mouseY;
            // Khôi phục lại công thức tính khoảng cách chuẩn để cảm giác nổ chân thực nhất
            const distance = Math.sqrt(dx * dx + dy * dy) || 1;

            const force = Math.min(3000 / distance, 50);
            const angle = Math.atan2(dy, dx);

            this.vx = Math.cos(angle) * force + (Math.random() - 0.5) * 15;
            this.vy = Math.sin(angle) * force + (Math.random() - 0.5) * 15;
          }
        }

        update(time, beatScale, dynamicHeartScale) {
          if (this.type !== "float") {
            if (isExploded) {
              this.vx *= 0.96;
              this.vy *= 0.96;
              this.x += this.vx;
              this.y += this.vy;
            } else {
              let targetX, targetY;

              if (this.type === "burst" || this.type === "outer_burst") {
                const finalScale =
                  this.type === "outer_burst"
                    ? dynamicHeartScale * 1.25
                    : dynamicHeartScale;
                targetX = width / 2 + this.hx * finalScale + this.offsetX;
                targetY =
                  height / 2 + (this.hy - 2.5) * finalScale + this.offsetY;
              } else {
                targetX = width / 2 + this.baseX * beatScale;
                targetY = height / 2 + this.baseY * beatScale;
              }

              const dx = targetX - this.x;
              const dy = targetY - this.y;

              this.vx += dx * 0.004;
              this.vy += dy * 0.004;

              this.vx *= 0.9;
              this.vy *= 0.9;

              this.x += this.vx;
              this.y += this.vy;
            }
          } else {
            this.x += this.vx;
            this.y += this.vy;
            this.x += Math.sin(time * 2 + this.y * 0.01) * 0.5;

            if (this.y < -20) {
              this.y = height + 20;
              this.x = Math.random() * width;
            }
            if (this.x < -20) this.x = width + 20;
            if (this.x > width + 20) this.x = -20;
          }
        }

        draw(ctx) {
          ctx.fillStyle = this.color;

          if (this.type !== "float") {
            // Hiệu ứng mờ giả lập shadowBlur (chạy rất nhẹ cho điện thoại)
            ctx.globalAlpha = 0.3;
            ctx.fillRect(this.x - 1, this.y - 1, this.size + 2, this.size + 2);
          }

          ctx.globalAlpha = 1.0;
          ctx.fillRect(this.x, this.y, this.size, this.size);
        }
      }

      function initTextParticles(text) {
        // Chỉ xóa hạt chữ cũ đi, giữ lại trái tim
        allParticles = allParticles.filter((p) => p.type !== "text");

        ctx.clearRect(0, 0, width, height);
        const displayText = text.trim() === "" ? " " : text;

        const fontSize = Math.min(width * 0.08, 60);
        ctx.font = `bold ${fontSize}px 'Brush Script MT', 'Great Vibes', cursive, sans-serif`;
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const textMetrics = ctx.measureText(displayText);
        const textWidth = textMetrics.width;

        baseHeartScale = (textWidth + 120) / 32;
        baseHeartScale = Math.max(baseHeartScale, Math.min(width, height) / 45);

        ctx.fillText(displayText, width / 2, height / 2);

        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;

        // Quét tạo điểm chữ, step = 5 để nhẹ máy
        const step = 5;
        for (let y = 0; y < height; y += step) {
          for (let x = 0; x < width; x += step) {
            const index = (y * width + x) * 4;
            const alpha = data[index + 3];

            if (alpha > 128) {
              const baseX = x - width / 2;
              const baseY = y - height / 2;
              allParticles.push(new Particle("text", baseX, baseY));
            }
          }
        }
        ctx.clearRect(0, 0, width, height);
      }

      function initParticles() {
        allParticles = [];
        for (let i = 0; i < FLOAT_COUNT; i++)
          allParticles.push(new Particle("float"));
        for (let i = 0; i < BURST_COUNT; i++)
          allParticles.push(new Particle("burst"));
        for (let i = 0; i < OUTER_BURST_COUNT; i++)
          allParticles.push(new Particle("outer_burst"));
      }

      // THỨ TỰ CHUẨN ĐỂ KHÔNG BỊ LỖI MẤT TRÁI TIM:
      // 1. Lấy kích thước màn hình
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      // 2. Khởi tạo trái tim (lúc này width/height đã có giá trị thực)
      initParticles();

      // 3. Khởi tạo chữ
      initTextParticles(currentText);

      // Xử lý khi thay đổi tên trong khung
      nameInput.addEventListener("input", (e) => {
        currentText = e.target.value;
        initTextParticles(currentText);
      });

      // Chỉ thay đổi lại chữ và vị trí khi xoay màn hình/đổi kích thước web
      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initTextParticles(currentText);
      });

      canvas.addEventListener("click", (e) => {
        clearTimeout(explosionTimeout);
        isExploded = true;

        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        allParticles.forEach((p) => p.explode(mouseX, mouseY));

        explosionTimeout = setTimeout(() => {
          isExploded = false;
        }, 5000);
      });

      function animate() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, width, height);

        const time = Date.now() * 0.001;
        const cycle = (time * 1000) % 1500;
        let beatScale = 1;

        if (cycle < 200) {
          beatScale = 1 + Math.sin((cycle / 200) * Math.PI) * 0.08;
        } else if (cycle > 300 && cycle < 500) {
          beatScale = 1 + Math.sin(((cycle - 300) / 200) * Math.PI) * 0.04;
        }

        const dynamicHeartScale = baseHeartScale * beatScale;

        // Vẽ tất cả bằng 1 vòng lặp duy nhất
        for (let i = 0; i < allParticles.length; i++) {
          const p = allParticles[i];
          p.update(time, beatScale, dynamicHeartScale);
          p.draw(ctx);
        }

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
