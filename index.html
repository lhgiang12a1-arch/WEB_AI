<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Xuân Triều 😡</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #1a1a1a;
        font-family: sans-serif;
      }
      button {
        padding: 40px 80px;
        font-size: 48px;
        font-weight: bold;
        border: none;
        border-radius: 20px;
        background: #6333ff;
        color: white;
        cursor: pointer;
        transition: 0.1s;
        box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
      }
      button:active {
        transform: scale(0.95);
        background: blue;
      }
      .rage {
        animation: shake 0.3s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-10px, 5px);
        }
        50% {
          transform: translate(10px, -5px);
        }
        75% {
          transform: translate(-5px, 10px);
        }
      }
      #text {
        position: absolute;
        font-size: 80px;
        font-weight: 900;
        color: #ff4444;
        opacity: 0;
        pointer-events: none;
      }
      #text.show {
        animation: pop 1s;
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        20% {
          opacity: 1;
          transform: scale(1.3);
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(2);
        }
      }
    </style>
  </head>
  <body>
    <button id="rageBtn">Xuân Triều 😡</button>
    <div id="text"><img src="./damluon.png" alt="" /></div>

    <script>
      const btn = document.getElementById("rageBtn");
      const text = document.getElementById("text");
      btn.onclick = () => {
        document.body.classList.add("rage");
        text.classList.add("show");
        setTimeout(() => {
          document.body.classList.remove("rage");
        }, 300);
        setTimeout(() => {
          text.classList.remove("show");
        }, 1000);
        new AudioContext().createOscillator().start();
      };
    </script>
  </body>
</html>
